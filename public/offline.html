<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIRMAN Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #0A0A0A; color: #fff; }
      main { width: min(420px, calc(100vw - 32px)); border: 1px solid #24243A; border-radius: 8px; background: #11111A; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #A0A0A0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline mode</h1>
      <p>NIRMAN is ready for field use. Saved inspections, reports, and uploads will sync when the network returns.</p>
    </main>
  </body>
</html>
