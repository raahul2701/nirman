<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARSPL NIRMAN Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #F7F5EF; color: #12332D; }
      main { width: min(420px, calc(100vw - 32px)); border: 1px solid #CDBD82; border-radius: 8px; background: #FFFFFF; padding: 24px; box-shadow: 0 18px 45px rgba(6, 46, 36, 0.08); }
      img { width: 176px; height: auto; display: block; margin-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #6C7568; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/branding/arspl-logo.png" alt="ARSPL NIRMAN AI" />
      <h1>Offline mode</h1>
      <p>ARSPL NIRMAN is ready for field use. Saved inspections, reports, and uploads will sync when the network returns.</p>
    </main>
  </body>
</html>
