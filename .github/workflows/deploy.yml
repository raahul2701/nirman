name: NIRMAN AI Production Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # Quality Checks Job
  quality-check:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: ESLint code linting
        run: npm run lint

      - name: Check for security vulnerabilities
        run: npm audit --audit-level moderate
        continue-on-error: true

  # Build & Test Job
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if present)
        run: npm test --if-present

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLAUDE_API_KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'NIRMAN AI' }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://nirmanai.com' }}
          VITE_COMPANY_NAME: ${{ secrets.VITE_COMPANY_NAME || 'ARSPL' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7

  # Environment Validation Job
  env-validation:
    name: Environment Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate Environment Secrets
        run: |
          set -e # exit immediately if a command exits with a non-zero status.
          
          if [[ -z "${{ secrets.VITE_SUPABASE_URL }}" ]]; then
            echo "ERROR: VITE_SUPABASE_URL is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]]; then
            echo "ERROR: VITE_SUPABASE_ANON_KEY is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.VITE_CLAUDE_API_KEY }}" ]]; then
            echo "ERROR: VITE_CLAUDE_API_KEY is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.VERCEL_TOKEN }}" ]]; then
            echo "ERROR: VERCEL_TOKEN is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.VERCEL_ORG_ID }}" ]]; then
            echo "ERROR: VERCEL_ORG_ID is not set"
            exit 1
          fi
          if [[ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
            echo "ERROR: VERCEL_PROJECT_ID is not set"
            exit 1
          fi
          echo "OK: All required production secrets are present."

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-check, build-and-test, env-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deployment
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: dist/

      - name: Comment deployment URL on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `Production Deployment Successful!\n\nBuild completed\nTests passed\nSecurity checks passed\n\nLive URL: ${{ steps.vercel-deployment.outputs.preview-url }}\n\nDeployed by: @${{ github.actor }}\nCommit: ${context.sha.substring(0, 7)}`
            })

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-check, build-and-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        id: vercel-staging
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dist/

      - name: Comment staging URL on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `Staging Deployment Successful!\n\nBuild completed\nTests passed\n\nStaging URL: ${{ steps.vercel-staging.outputs.preview-url }}\n\nDeployed by: @${{ github.actor }}\nCommit: ${context.sha.substring(0, 7)}`
            })
